# Caught by Scouts on a Mac/laptop with the SIYI A8 mini over Ethernet (USB-C Ethernet adapter).
# Set the adapter to a static IP: 192.168.144.20, subnet 255.255.255.0, no router.
# Visitor phones reach the share page over the laptop's Wi-Fi.
camera:
  source: rtsp://192.168.144.25:8554/main.264
  mirror: false

detector:
  model: yolo11n-seg.pt
  device: mps
  conf: 0.45

booth:
  event: SAFETY & SECURITY ASIA 2026
  website: thescouts.io

share:
  port: 8080
  public_base_url: ""     # empty = http://<this Mac's Wi-Fi IP>:8080
  require_details: true

display:
  fullscreen: true
